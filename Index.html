<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DARKNOTE AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #0d0d0d;
      --panel: #111;
      --text: #fff;
      --accent: red;
    }

    body.light {
      --bg: #f5f5f5;
      --panel: #fff;
      --text: #000;
      --accent: #007bff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: var(--panel);
      padding: 15px;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent);
      text-align: center;
      margin-bottom: 20px;
    }

    .sidebar button {
      padding: 10px;
      border: none;
      background: #222;
      color: var(--text);
      cursor: pointer;
      border-radius: 6px;
    }

    .sidebar button:hover {
      background: var(--accent);
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel);
      padding: 15px;
      text-align: center;
      font-weight: bold;
      border-bottom: 1px solid #222;
    }

    .chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .msg {
      margin: 8px 0;
      padding: 10px;
      border-radius: 10px;
      max-width: 70%;
      animation: fadeIn 0.3s ease;
    }

    .user {
      background: #1a1a1a;
      align-self: flex-end;
    }

    .bot {
      background: #222;
      align-self: flex-start;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1;}
    }

    /* Input */
    .input-box {
      display: flex;
      border-top: 1px solid #222;
    }

    input {
      flex: 1;
      padding: 15px;
      border: none;
      outline: none;
      background: var(--panel);
      color: var(--text);
    }

    button.send {
      padding: 15px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }

    button.send:hover {
      opacity: 0.8;
    }

    /* Typing dots */
    .typing span {
      animation: blink 1.5s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }

    /* Mobile */
    @media(max-width: 768px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">DARKNOTE</div>
    <button onclick="clearChat()">🧹 Clear Chat</button>
    <button onclick="toggleTheme()">🌗 Toggle Theme</button>
    <button onclick="saveChat()">💾 Save Chat</button>
  </div>

  <!-- Main -->
  <div class="main">
    <header>DARKNOTE AI CHAT</header>

    <div class="chat" id="chat"></div>

    <div class="input-box">
      <input type="text" id="input" placeholder="Type message..." onkeydown="if(event.key==='Enter') send()">
      <button class="send" onclick="send()">Send</button>
    </div>
  </div>

<script>
  const chat = document.getElementById("chat");

  // Load saved chat
  window.onload = () => {
    const saved = localStorage.getItem("chat");
    if (saved) chat.innerHTML = saved;
  };

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function send() {
    const input = document.getElementById("input");
    if (!input.value.trim()) return;

    addMessage(input.value, "user");

    const typing = document.createElement("div");
    typing.className = "msg bot typing";
    typing.innerHTML = "<span>.</span><span>.</span><span>.</span>";
    chat.appendChild(typing);

    chat.scrollTop = chat.scrollHeight;

    setTimeout(() => {
      typing.remove();
      addMessage(generateReply(input.value), "bot");
    }, 1200);

    input.value = "";
  }

  function generateReply(msg) {
    msg = msg.toLowerCase();

    if (msg.includes("hello")) return "Hey 👋 I am DarkNote AI.";
    if (msg.includes("bot")) return "Yes, I'm your AI system.";
    if (msg.includes("help")) return "Try asking me anything 😉";
    return "I am still learning... 🤖";
  }

  function clearChat() {
    chat.innerHTML = "";
  }

  function toggleTheme() {
    document.body.classList.toggle("light");
  }

  function saveChat() {
    localStorage.setItem("chat", chat.innerHTML);
    alert("Chat saved!");
  }
</script>

</body>
</html>
